[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "masterytax"
version = "0.1.0"
description = "Open, explainable payroll tax liabilities, deposits and filings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
masterytax = "masterytax.cli:main"

[tool.setuptools]
packages = ["masterytax"]

[tool.setuptools.package-data]
masterytax = ["data/*.json"]
